[package]
name = "molisnap"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
